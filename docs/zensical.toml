[project]
site_url = "https://yeriel.github.io/mangosta/"
site_name = "Mangosta"
site_description = "Lightweight MLOps and Model Lifecycle Management for PyTorch"
site_author = "Yeriel & Mangosta Contributors"
docs_dir = "content"

copyright = "Copyright &copy; 2026 Yeriel"

repo_url = "https://github.com/yeriel/mangosta"
repo_name = "yeriel/mangosta"
edit_uri = "edit/main/docs/content/"

nav = [
  { "Mangosta" = "index.md" },
  { "Learn" = [
      { "Installation" = "installation.md" },
      { "Tutorial - User Guide" = [
          { "01. First Project (init)" = "tutorial/01_first_project.md" },
          { "02. Config & Registries" = "tutorial/02_config_and_registries.md" },
          { "03. Training with BaseTrainer" = "tutorial/03_training_with_basetrainer.md" },
          { "04. Checkpoints & RNG Resume" = "tutorial/04_checkpoints_and_resume.md" },
          { "05. Tracking & mangosta view" = "tutorial/05_visual_tracking_and_view.md" },
          { "06. ONNX Export & Serving" = "tutorial/06_onnx_export_and_serving.md" },
      ] },
  ] },
  { "CLI & Agents" = "cli_and_agents.md" },
  { "Reference" = [
      { "mangosta.core" = "api/core.md" },
      { "mangosta.engine" = "api/engine.md" },
      { "mangosta.artifacts" = "api/artifacts.md" },
      { "mangosta.tracking" = "api/tracking.md" },
      { "mangosta.export & serving" = "api/export_and_serving.md" },
      { "mangosta.exceptions" = "api/exceptions.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/yeriel/mangosta"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
