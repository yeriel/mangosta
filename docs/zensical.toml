[project]
site_url = "https://yeriel.github.io/mangosta/"
site_name = "Mangosta"
site_description = "Lightweight MLOps and Model Lifecycle Management for PyTorch"
site_author = "Yeriel & Mangosta Contributors"
docs_dir = "content"

copyright = "Copyright &copy; 2026 Yeriel"

repo_url = "https://github.com/yeriel/mangosta"
repo_name = "yeriel/mangosta"
edit_uri = "edit/main/docs/content/"

nav = [
  { "Overview" = "index.md" },
  { "Installation & Flags" = "installation.md" },
  { "Philosophy & Vision (80/20)" = "philosophy_and_vision.md" },
  { "Step-by-Step Guides" = [
      { "01. Lifecycle: Train vs. Prod" = "guides/01_fast_prototyping.md" },
      { "02. Checkpoints & Resume" = "guides/02_fault_tolerance_and_resumption.md" },
      { "03. Export, Inspect & Reports" = "guides/03_production_serving_and_contracts.md" },
      { "04. Visual Tracking & View" = "guides/05_visualization_and_timelapses.md" },
  ] },
  { "100% Agent-Friendly & CLI" = "agent_friendly.md" },
  { "Runnable Examples" = "examples.md" },
  { "API Reference" = [
      { "mangosta.core" = "api/core.md" },
      { "mangosta.artifacts" = "api/artifacts.md" },
      { "mangosta.tracking" = "api/tracker.md" },
      { "mangosta.export" = "api/export.md" },
      { "mangosta.serving" = "api/serving.md" },
      { "mangosta.core.schema" = "api/schema.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/yeriel/mangosta"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
