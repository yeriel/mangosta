[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangosta"
version = "0.1.0a1"
description = "Lightweight MLOps and model lifecycle management for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mangosta Developers" }
]
keywords = ["pytorch", "mlops", "checkpointing", "tracking", "model-registry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.14.0",
]

[project.scripts]
mangosta = "mangosta.cli.main:main"

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mangosta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

